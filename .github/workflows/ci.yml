name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build WASM (js/wasm with tinygo tag)
        run: GOOS=js GOARCH=wasm go build -tags tinygo -o cheesse.wasm .
      - name: Report bundle size
        run: |
          ls -la cheesse.wasm
          gzip -c cheesse.wasm | wc -c | xargs -I{} echo "gzipped: {} bytes"
