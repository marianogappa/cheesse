name: Promote to ostinato-examples

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Build and push to ostinato-examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.41.1"

      - name: Validate tag format
        run: |
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Input '$TAG' does not match vX.Y.Z format"
            exit 1
          fi

      - name: Build WASM
        run: |
          TAG="${{ inputs.tag }}"
          tinygo build -o site/cheesse.wasm -target wasm -tags tinygo \
            -ldflags "-X main.Version=$TAG" .

      - name: Copy TinyGo wasm_exec.js
        run: cp "$(tinygo env TINYGOROOT)/targets/wasm_exec.js" site/wasm_exec.js

      - name: Push to ostinato-examples gh-pages
        run: |
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote cheesse ${{ inputs.tag }}"
          git remote add target "https://x-access-token:${{ secrets.OSTINATO_EXAMPLES_PAT }}@github.com/marianogappa/ostinato-examples.git"
          git push target gh-pages --force
