name: Benchmarks

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run benchmarks
        run: |
          go test -run='^$' -bench=Benchmark -benchmem -benchtime=2s -count=1 ./core/ ./ai/ ./api/ 2>&1 | tee bench-results.txt

      - name: Build results summary
        id: summary
        run: |
          {
            echo "BENCH_TABLE<<EOF"
            echo "| Benchmark | Time | Allocs | Bytes |"
            echo "|---|---|---|---|"
            grep '^Benchmark' bench-results.txt | while read -r name iters time unit alloc aunit bytes bunit; do
              short="${name%-*}"
              echo "| ${short} | ${time} ${unit} | ${alloc} | ${bytes} |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update README with benchmark results (master only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          TABLE=$(grep '^Benchmark' bench-results.txt | while read -r name iters time unit alloc aunit bytes bunit; do
            short="${name%-*}"
            echo "| ${short} | ${time} ${unit} | ${alloc} | ${bytes} |"
          done)

          # Build the replacement block
          BLOCK="<!-- bench-start -->
          <details>
          <summary>Benchmark results (auto-updated on every push)</summary>

          | Benchmark | Time | Allocs | Bytes |
          |---|---|---|---|
          ${TABLE}

          *Run: $(date -u '+%Y-%m-%d %H:%M UTC') on GitHub Actions (ubuntu-latest, 2-core)*
          </details>
          <!-- bench-end -->"

          # Replace the block in README.md
          if grep -q 'bench-start' README.md; then
            python3 -c "
          import re, sys
          readme = open('README.md').read()
          block = sys.stdin.read()
          readme = re.sub(r'<!-- bench-start -->.*?<!-- bench-end -->', block, readme, flags=re.DOTALL)
          open('README.md', 'w').write(readme)
          " <<< "$BLOCK"
          else
            echo "" >> README.md
            echo "$BLOCK" >> README.md
          fi

          if git diff --quiet -- README.md; then
            echo "README unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(bench): update benchmark results [skip ci]"
          git push

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('bench-results.txt', 'utf8');
            const lines = raw.split('\n').filter(l => l.startsWith('Benchmark'));
            let table = '| Benchmark | Time | Allocs | Bytes |\n|---|---|---|---|\n';
            for (const line of lines) {
              const parts = line.trim().split(/\s+/);
              const name = parts[0].replace(/-\d+$/, '');
              table += `| ${name} | ${parts[2]} ${parts[3]} | ${parts[4]} | ${parts[6]} |\n`;
            }
            const marker = '<!-- cheesse-bench -->';
            const body = `${marker}\n### Benchmark results\n\n${table}\n*${new Date().toISOString()}*`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
