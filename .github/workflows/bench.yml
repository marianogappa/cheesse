name: Benchmarks

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run benchmarks
        run: |
          go test -run='^$' -bench=Benchmark -benchmem -benchtime=2s -count=1 ./core/ ./ai/ ./api/ 2>&1 | tee bench-results.txt

      - name: Format results
        run: |
          python3 scripts/format-bench.py < bench-results.txt > bench-table.md
          cat bench-table.md

      - name: Update README with benchmark results (master only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          TABLE=$(cat bench-table.md)

          BLOCK="<!-- bench-start -->
          <details>
          <summary>Benchmark results (auto-updated on every push)</summary>

          ${TABLE}

          *Run: $(date -u '+%Y-%m-%d %H:%M UTC') on GitHub Actions (ubuntu-latest)*
          </details>
          <!-- bench-end -->"

          if grep -q 'bench-start' README.md; then
            python3 -c "
          import re, sys
          readme = open('README.md').read()
          block = sys.stdin.read()
          readme = re.sub(r'<!-- bench-start -->.*?<!-- bench-end -->', block, readme, flags=re.DOTALL)
          open('README.md', 'w').write(readme)
          " <<< "$BLOCK"
          else
            echo "" >> README.md
            echo "$BLOCK" >> README.md
          fi

          if git diff --quiet -- README.md; then
            echo "README unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(bench): update benchmark results [skip ci]"
          git push

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('bench-table.md', 'utf8');
            const marker = '<!-- cheesse-bench -->';
            const body = `${marker}\n### Benchmark results\n\n${table}\n\n*${new Date().toISOString()}*`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
