<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Chess king silhouette with cheese texture -->
  <!-- Cross -->
  <rect x="29" y="1" width="6" height="8" rx="1.5" fill="#f5c842"/>
  <rect x="25.5" y="3" width="13" height="4" rx="1.5" fill="#f5c842"/>
  <!-- Head -->
  <ellipse cx="32" cy="14" rx="7" ry="5.5" fill="#f5c842"/>
  <!-- Neck -->
  <path d="M27 18 L37 18 L36 22 L28 22 Z" fill="#f5c842"/>
  <!-- Body -->
  <path d="M24 22 C24 22 20 24 18 36 L18 48 L46 48 L46 36 C44 24 40 22 40 22 Z" fill="#f5c842"/>
  <!-- Base rim -->
  <rect x="15" y="48" width="34" height="5" rx="2" fill="#e8b830"/>
  <rect x="13" y="52" width="38" height="6" rx="2.5" fill="#daa520"/>
  <!-- Large cheese holes -->
  <ellipse cx="26" cy="32" rx="4" ry="3.5" fill="#daa520" opacity="0.55"/>
  <ellipse cx="37" cy="38" rx="3.5" ry="3" fill="#daa520" opacity="0.55"/>
  <ellipse cx="29" cy="43" rx="3" ry="2.5" fill="#daa520" opacity="0.5"/>
  <!-- Medium cheese holes -->
  <circle cx="35" cy="28" r="2.5" fill="#d49b18" opacity="0.5"/>
  <circle cx="22" cy="40" r="2.2" fill="#d49b18" opacity="0.45"/>
  <circle cx="39" cy="44" r="1.8" fill="#d49b18" opacity="0.45"/>
  <!-- Small cheese holes -->
  <circle cx="31" cy="27" r="1.3" fill="#c88c10" opacity="0.4"/>
  <circle cx="24" cy="36" r="1" fill="#c88c10" opacity="0.4"/>
  <circle cx="40" cy="33" r="1.2" fill="#c88c10" opacity="0.35"/>
  <!-- Head cheese holes -->
  <ellipse cx="29" cy="13" rx="2" ry="1.5" fill="#daa520" opacity="0.5"/>
  <circle cx="35" cy="14.5" r="1.3" fill="#daa520" opacity="0.45"/>
  <!-- Subtle body outline for definition -->
  <path d="M24 22 C24 22 20 24 18 36 L18 48 L46 48 L46 36 C44 24 40 22 40 22" fill="none" stroke="#c89820" stroke-width="1"/>
  <ellipse cx="32" cy="14" rx="7" ry="5.5" fill="none" stroke="#c89820" stroke-width="0.8"/>
</svg>
